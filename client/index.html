<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Riley</title>
    <meta name="description" content="Your personal AI agents" />
    <meta name="theme-color" content="#0b0a1a" />
    <meta name="color-scheme" content="dark" />
    <!-- The chosen theme, before anything paints (see src/lib/theme.js). No choice means Aurora. -->
    <script>try { var t = localStorage.getItem('jarvis:theme'), d = document.documentElement.dataset; if (t && t !== 'aurora') { d.theme = t; if (t === 'light') d.mode = 'light'; } } catch (e) {}</script>
    <!-- iPhone home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Riley" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
  </head>

    <div id="root"></div>

  </body>
</html>
